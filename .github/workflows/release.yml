name: Release

# Foundry fetches the manifest URL to learn what the latest version is, and the
# download URL to install it. Both point at `releases/latest/download/...`, so
# publishing a release with those two assets attached is the whole contract.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # check-templates renders the real templates, so it needs handlebars.
      - name: Install test dependencies
        run: npm ci

      # A broken import disables the module silently in Foundry, so nothing
      # ships without the suite passing.
      - name: Test
        run: npm test

      - name: Check the tag matches the manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./module.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $tag does not match module.json version $manifest." >&2
            echo "Foundry offers an update by comparing versions, so these must agree." >&2
            exit 1
          fi

      # `manifest` has to stay at releases/latest so Foundry can find the newest
      # version when it checks for updates. `download` must not: this release's
      # manifest is archived under its own tag forever, and a user installing
      # 1.0.0 two years from now has to get 1.0.0's zip, not whatever is newest.
      # The two fields point at different places on purpose.
      - name: Point this release's manifest at its own zip
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("module.json", "utf8"));
            m.download = `https://github.com/${process.env.REPO}/releases/download/${process.env.TAG}/module.zip`;
            fs.writeFileSync("module.json", JSON.stringify(m, null, 2) + "\n");
            console.log("download ->", m.download);
            console.log("manifest ->", m.manifest);
          '
          # A silent no-op here would ship the bug it exists to prevent.
          node -e '
            const m = require("./module.json");
            if (!m.download.includes(process.env.TAG)) {
              console.error("download URL was not rewritten to the tagged zip");
              process.exit(1);
            }
            if (!m.manifest.includes("releases/latest")) {
              console.error("manifest URL must stay at releases/latest for update checks");
              process.exit(1);
            }
          '

      # Only what Foundry actually loads. Tests, the local Foundry install and
      # the working notes have no business in a user's modules directory.
      - name: Build the package
        run: |
          zip -r module.zip \
            module.json \
            LICENSE \
            NOTICE.md \
            README.md \
            CHANGELOG.md \
            scripts \
            styles \
            templates \
            lang \
            -x '*.DS_Store'
          unzip -l module.zip

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            module.json
            module.zip
          generate_release_notes: true
